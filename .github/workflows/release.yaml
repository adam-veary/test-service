name: Release
run-name: Release

on:
  workflow_run:
    workflows: CI
    types:
      - completed
    branches:
      - main
      - 'testing*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  DetermineVersion:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump_version.outputs.new_version }}
      new_version_no_prefix: ${{ steps.bump_version.outputs.new_version_no_prefix }}
    steps:
      - name: Get Latest Release
        id: get_latest_release
        uses: octokit/request-action@v2.x
        with:
          route: GET /repos/${{ github.repository }}/releases/latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pick Bump Type
        id: pick_bump_type
        uses: xometry/the-forge/pick-bump-type@pick-bump-type-v1
        with:
          commit_message: ${{ github.event.workflow_run.head_commit.message }}
      - name: Bump Version
        id: bump_version
        uses: xometry/the-forge/bump-sem-ver@bump-sem-ver-v1
        with:
          current_version: ${{ fromJson(steps.get_latest_release.outputs.data).tag_name }}
          bump_type: ${{ steps.pick_bump_type.outputs.bump_type }}

  PublishHelmChart:
    uses: xometry/the-forge/.github/workflows/helm-publish.yml@helm-publish-v2
    needs: DetermineVersion
    with:
      chart_path: charts/test-service
      helm_repo_url: https://helm-charts.ci.dev.xometry.net
      version: ${{ needs.DetermineVersion.outputs.new_version_no_prefix }}

  PublishDockerImage:
     needs: DetermineVersion
     runs-on: [self-hosted, managed-global-dev]
     steps:
      - name: credential build artifacts
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: arn:aws:iam::694713800774:role/github_actions_assume_role
          aws-region: us-east-2
          mask-aws-account-id: "no"
          role-duration-seconds: 1200
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      - name: Publish Docker Image
        uses: xometry/the-forge/docker-publish@docker-publish-v1
        with:
          destination_tag: 694713800774.dkr.ecr.us-east-2.amazonaws.com/test-service:${{ needs.DetermineVersion.outputs.new_version }}
          source_tag: 694713800774.dkr.ecr.us-east-2.amazonaws.com/test-service:${{ github.sha }}
          docker_username: ${{ steps.login-ecr.outputs.docker_username_694713800774_dkr_ecr_us_east_2_amazonaws_com }}
          docker_password: ${{ steps.login-ecr.outputs.docker_password_694713800774_dkr_ecr_us_east_2_amazonaws_com }}

  PublishRelease:
    runs-on: ubuntu-latest
    needs:
      - DetermineVersion
      - PublishHelmChart
      - PublishDockerImage
    steps:
      - name: Create Release
        uses: octokit/request-action@v2.x
        with:
          route: POST /repos/${{ github.repository }}/releases
          tag_name: ${{ needs.DetermineVersion.outputs.new_version }}
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false
      - name: Trigger Deployment
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yaml',
              ref: '${{ github.ref_name }}',
              inputs: {
              release_tag: '${{ needs.DetermineVersion.outputs.new_version }}'
              },
            })
