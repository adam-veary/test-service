{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "test-service.serviceAccountName" . }}
  labels:
    {{- include "test-service.labels" . | nindent 4 }}
    {{- include "test-service.selectorLabels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.iamRoleArn | required "You must specify serviceAccount.iamRoleArn" | quote }}
{{- end -}}
